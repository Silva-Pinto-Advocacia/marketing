<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="__ASSETS__/fonts/fonts_local.css">
<link rel="stylesheet" href="__ASSETS__/fonts/extra_local.css">
<style>
  :root{ --navy:#17181B; --navy2:#222327; --gold:#F0CF86; --gold2:#DDB363; --gold3:#FFF0CC; --white:#FFFFFF; --wa:#25D366; --muted:rgba(255,255,255,.62); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--white)}
  .stage{position:absolute;inset:0;overflow:hidden;background:var(--navy)}
  .goldtxt{background:linear-gradient(180deg,var(--gold3) 0%,var(--gold) 50%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}

  /* video window */
  .vwin{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  #vid{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 38%;will-change:transform,filter;filter:contrast(1.07) saturate(1.1) brightness(1.03)}
  .vwin .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 50%, rgba(0,0,0,.42) 100%)}
  .vwin .fade{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(to bottom, rgba(23,24,27,0) 0%, rgba(23,24,27,.5) 32%, rgba(23,24,27,.8) 62%, rgba(23,24,27,.9) 100%)}
  .pmerj{position:absolute;right:52px;top:52px;width:200px;height:auto;z-index:4;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}

  /* top chrome */
  .prog{position:absolute;left:0;top:0;height:6px;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold3));z-index:5}
  .logo{position:absolute;left:56px;top:50px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
  /* a logo é sempre a arte oficial (brasão + SILVA PINTO na letra da marca + ADVOCACIA), nunca o nome digitado
     numa fonte parecida: pedido do Casil, 05/10/2026 */
  .logo img{width:250px;height:auto}
  .card .clogo{display:none}
  .card .grain{display:none}
  .outro .ologo{width:420px;margin-bottom:60px}

  /* captions over video bottom */
  .cap{position:absolute;left:0;right:0;top:1160px;height:230px;padding:0 48px;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;text-align:center;font-weight:800;font-size:78px;line-height:1.05;letter-spacing:-0.015em;
       text-shadow:0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.6);will-change:transform,opacity;z-index:3}
  .cap span{display:inline-block;margin:0 11px 8px;transition:none}
  .cap .capin{display:inline-block;padding:22px 54px 14px;border-radius:80px;background:radial-gradient(ellipse 100% 100% at 50% 50%, rgba(23,24,27,.6) 0%, rgba(23,24,27,.35) 60%, rgba(23,24,27,0) 100%)}
  .cap span.cur{color:var(--gold);transform:translateY(-4px) scale(1.07)}
  .cap span.done{color:var(--white)}
  .cap span.todo{color:rgba(255,255,255,.55)}

  /* panel */
  .panel{position:absolute;left:0;top:0;width:1080px;height:1920px;background:none;overflow:hidden;pointer-events:none}
  .panel::before{content:none}
  .panel .glow{display:none}
  .footer{position:absolute;left:56px;right:56px;bottom:48px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(217,183,120,.35);padding-top:22px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .footer .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:46px;letter-spacing:.05em;line-height:1}
  .footer .r{font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:8px}
  .footer .h{font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:.12em;color:var(--muted)}

  .ps{position:absolute;left:56px;width:968px;top:1440px;height:440px;opacity:0;will-change:opacity,transform;text-shadow:0 3px 18px rgba(0,0,0,.75),0 0 40px rgba(0,0,0,.5)}
  .ps .k{font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:16px}
  .ps .k::before{content:"";width:34px;height:2px;background:var(--gold)}
  .ps .big{font-family:"Bebas Neue",Impact,sans-serif;font-size:240px;line-height:.9;letter-spacing:.005em;margin-top:22px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7))}
  .ps .big small{font-size:104px;letter-spacing:.02em;margin-left:18px;color:var(--white);-webkit-text-fill-color:var(--white)}
  .ps .sub{font-size:38px;line-height:1.3;color:rgba(255,255,255,.94);margin-top:14px;font-weight:600;max-width:900px}
  .ps .sub b{color:var(--gold);font-weight:800}
  .ps .head{font-family:"Bebas Neue",Impact,sans-serif;font-size:122px;line-height:.92;letter-spacing:.006em;margin-top:4px;padding-top:.14em;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
  .ps .head.w{color:var(--white)}
  .ps .goldtxt{text-shadow:none}
  .ps .head.goldtxt{background:linear-gradient(180deg,#FFF3D6 0%,#F4D692 55%,#EBC776 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* list */
  .ps .list{margin-top:26px;display:flex;flex-direction:column;gap:18px}
  .ps .li{display:flex;align-items:center;gap:24px;font-size:44px;font-weight:700;opacity:0}
  .ps .li i{width:58px;height:58px;border:2px solid var(--gold);display:grid;place-items:center;flex:none;font-family:"JetBrains Mono";font-size:22px;color:var(--gold);background:rgba(23,24,27,.5)}
  .ps .li.on i{background:var(--gold);color:var(--navy)}
  /* timeline */
  .ps .tl{position:relative;margin-top:70px;height:170px;margin-left:70px;margin-right:70px}
  .ps .tl .track{position:absolute;left:0;right:0;top:60px;height:3px;background:rgba(255,255,255,.14)}
  .ps .tl .track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold)}
  .ps .tl .node{position:absolute;top:36px;width:52px;height:52px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);transform:translateX(-50%) scale(0);display:grid;place-items:center}
  .ps .tl .node::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--gold)}
  .ps .tl .lab{position:absolute;top:110px;transform:translateX(-50%);text-align:center;font-family:"JetBrains Mono";font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:0;white-space:nowrap}
  .ps .tl .lab b{display:block;font-family:Manrope;font-size:34px;font-weight:800;letter-spacing:0;color:var(--white);text-transform:none;margin-bottom:6px}
  /* sum */
  .ps .sum{display:flex;align-items:baseline;gap:22px;margin-top:30px;flex-wrap:wrap}
  .ps .sum .term{font-family:"Bebas Neue",Impact,sans-serif;font-size:100px;line-height:1;opacity:0}
  .ps .sum .op{font-family:"Bebas Neue",Impact,sans-serif;font-size:76px;color:var(--gold);opacity:0}
  .ps .sum .res{font-family:"Bebas Neue",Impact,sans-serif;font-size:190px;line-height:.9;margin-top:8px;opacity:0;width:100%;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7))}
  .ps .sum .res small{font-size:84px;color:var(--white);-webkit-text-fill-color:var(--white);margin-left:16px}
  /* cta */
  .ps .pill{display:inline-flex;align-items:center;gap:18px;background:var(--wa);color:#fff;padding:22px 38px;border-radius:999px;font-size:36px;font-weight:800;margin-top:24px;opacity:0;text-shadow:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .ps .pill i{width:16px;height:16px;border-radius:50%;background:#fff}

  /* full cards */
  .card{position:absolute;inset:0;opacity:0;will-change:opacity;overflow:hidden}
  .card .bg{display:none}
  .card .tint{display:none}
  .card .in{position:absolute;left:0;right:0;top:1120px;height:640px;padding:0 80px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(ellipse 62% 55% at 50% 50%, rgba(23,24,27,.6) 0%, rgba(23,24,27,.3) 60%, rgba(23,24,27,0) 100%)}
  .card .k{font-family:"JetBrains Mono",monospace;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:18px;margin-bottom:40px}
  .card .k::before{content:"";width:40px;height:2px;background:var(--gold)}
  .card .t{font-family:"Bebas Neue",Impact,sans-serif;font-size:190px;line-height:.9;letter-spacing:.004em;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
  .card .t.small{font-size:150px}
  .card .t .w{display:inline-block;transform:translateY(110%);opacity:0;padding-top:.22em;margin-top:-.22em}
  .card .t .ln{display:block;overflow:visible;padding:.1em 0 .04em}
  .card .s{font-family:Fraunces,Georgia,serif;font-size:46px;line-height:1.25;color:rgba(255,255,255,.95);margin-top:44px;max-width:900px;opacity:0;text-shadow:0 4px 24px rgba(0,0,0,.6)}
  .card .sweep{position:absolute;top:0;bottom:0;width:260px;background:linear-gradient(90deg,rgba(217,183,120,0),rgba(217,183,120,.55),rgba(217,183,120,0));left:-300px;mix-blend-mode:screen}
  .card .corner{display:none}
  .card .corner.tl{left:60px;top:150px;border-right:0;border-bottom:0}
  .card .corner.br{right:60px;bottom:150px;border-left:0;border-top:0}

  /* outro */
  .outro{position:absolute;inset:0;opacity:0;overflow:hidden}
  .outro .bg{position:absolute;inset:-60px;background-size:cover;background-position:center 30%;filter:blur(26px) brightness(.55) saturate(1.1);transform:scale(1.12)}
  .outro .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,24,27,.35),rgba(23,24,27,.78))}
  .outro .in{position:absolute;left:80px;right:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
  .outro .h{font-family:"Bebas Neue",Impact,sans-serif;font-size:190px;line-height:.9}
  .outro .pill{margin-top:60px;display:inline-flex;align-self:flex-start;align-items:center;gap:22px;background:var(--wa);color:#fff;padding:32px 50px;border-radius:999px;font-size:46px;font-weight:800}
  .outro .pill i{width:22px;height:22px;border-radius:50%;background:#fff}
  .outro .brand{margin-top:64px;font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .outro .disc{position:absolute;left:80px;right:80px;bottom:150px;font-size:22px;line-height:1.5;color:rgba(255,255,255,.5)}
  .flash{position:absolute;inset:0;background:var(--gold);opacity:0;pointer-events:none;mix-blend-mode:screen}
  .insert{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}
  .insert img{width:520px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
  /* titulo fixo: faixa grafite abaixo do logo e do brasao, o assunto do video do inicio ao fim */
  .titulo{position:absolute;left:70px;right:70px;top:300px;z-index:4;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;will-change:opacity,transform}
  .titulo .tx{display:inline-block;background:rgba(23,24,27,.82);border:1px solid rgba(217,183,120,.45);border-radius:18px;padding:22px 36px 18px;font-weight:800;font-size:54px;line-height:1.12;letter-spacing:-.01em;box-shadow:0 12px 34px rgba(0,0,0,.4)}
  .titulo .tx b{color:var(--gold);font-weight:800}
  .titulo.compacto .tx{font-size:38px;padding:14px 24px 12px;border-radius:14px}
  .titulo.compacto .ch{font-size:22px;margin-top:10px;padding:7px 18px}
  .titulo.esquerda,.titulo.barra{align-items:flex-start;text-align:left}
  .titulo .ch{margin-top:16px;display:inline-block;background:var(--gold);color:var(--navy);border-radius:999px;padding:10px 26px;font-weight:800;font-size:30px;letter-spacing:.01em}
  /* faixa de decisao (cena da metade inferior): grafite, fio dourado que se desenha, kicker e manchete palavra a palavra */
  .ps.faixa{top:1450px}
  .ps .fx{position:relative;background:rgba(23,24,27,.86);border:1px solid rgba(217,183,120,.45);border-radius:18px;padding:30px 40px 34px 58px;box-shadow:0 12px 34px rgba(0,0,0,.4);text-shadow:none}
  .ps .fx .bar{position:absolute;left:24px;top:30px;width:4px;height:0;border-radius:2px;background:linear-gradient(180deg,var(--gold3),var(--gold2))}
  .ps .fx .k{font-size:24px;letter-spacing:.26em;opacity:0}
  .ps .fx .k::before{content:none}
  .ps .fx .h{margin-top:16px;font-weight:800;font-size:56px;line-height:1.14;letter-spacing:-.01em}
  .ps .fx .h span{display:inline-block;opacity:0}
  /* abertura com brasao central: entra na metade inferior e voa para o canto, onde vira a logo do orgao */
  #bhalo{position:absolute;left:540px;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle,rgba(240,207,134,.30) 0%,rgba(240,207,134,.10) 38%,rgba(240,207,134,0) 66%);opacity:0;z-index:3;pointer-events:none}
  #bimg{position:absolute;left:0;top:0;z-index:4;transform-origin:0 0;filter:drop-shadow(0 14px 34px rgba(0,0,0,.55));opacity:0;will-change:transform,opacity}
  #bname{position:absolute;left:0;right:0;text-align:center;z-index:4;opacity:0}
  #bname .k{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  #bname .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:104px;line-height:.9;margin-top:6px;padding-top:.14em;filter:drop-shadow(0 6px 22px rgba(0,0,0,.7))}
  #bname .fios{position:relative;height:2px;margin:18px auto 0;width:760px}
  #bname .fios i{position:absolute;top:0;height:2px;width:0;background:linear-gradient(90deg,rgba(240,207,134,0),var(--gold))}
  #bname .fios i.l{right:50%;margin-right:110px}
  #bname .fios i.r{left:50%;margin-left:110px;background:linear-gradient(270deg,rgba(240,207,134,0),var(--gold))}
  /* legenda "caixa": caixa dourada que desliza de palavra em palavra, palavra falada em grafite */
  .cap-caixa .cap .capin{position:relative}
  .cap-caixa .cap span{position:relative;z-index:1}
  .cap-caixa .cap span.cur{color:var(--navy);transform:none;text-shadow:none}
  .cap .hl{position:absolute;z-index:0;border-radius:14px;background:linear-gradient(180deg,#FFF3D6 0%,#F4D692 55%,#EBC776 100%);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .a{opacity:0}

  /* ===== formato deitado (1920x1080): o rosto fica no centro do quadro; legenda embaixo, no centro;
     textos grandes, infograficos e o brasao da abertura no painel da direita, sobre uma sombra lateral
     que so aparece com eles. Mesmos elementos e animacoes do formato em pe, outra geometria ===== */
  html.deitado,html.deitado body{width:1920px;height:1080px}
  .vwin .lado{display:none}
  .deitado .vwin,.deitado #vid,.deitado .panel{width:1920px;height:1080px}
  .deitado .vwin .fade{height:380px}
  .deitado .vwin .lado{display:block;position:absolute;top:0;bottom:0;right:0;width:1000px;opacity:0;background:linear-gradient(to left, rgba(23,24,27,.86) 0%, rgba(23,24,27,.72) 42%, rgba(23,24,27,0) 100%)}
  .deitado .pmerj{width:160px}
  .deitado .cap{top:800px;height:180px;padding:0 330px;font-size:60px}
  .deitado .cap span{margin:0 8px 6px}
  .deitado .cap .capin{padding:16px 40px 10px}
  .deitado .titulo{left:420px;right:420px;top:54px}
  .deitado .titulo .tx{font-size:40px;padding:16px 28px 13px;border-radius:14px}
  .deitado .titulo .ch{font-size:24px;margin-top:12px;padding:8px 20px}
  .deitado .card .in{left:1160px;right:0;top:200px;height:600px;padding:0 70px 0 30px;background:none}
  .deitado .card .k{font-size:22px;margin-bottom:26px}
  .deitado .card .t{font-size:128px}
  .deitado .card .t.small{font-size:106px}
  .deitado .card .s{font-size:34px;margin-top:28px;max-width:660px}
  .deitado .ps{left:1160px;width:700px;top:290px;height:490px}
  .deitado .ps .k{font-size:18px}
  .deitado .ps .big{font-size:150px;margin-top:16px}
  .deitado .ps .big small{font-size:64px}
  .deitado .ps .sub{font-size:28px;max-width:680px}
  .deitado .ps .head{font-size:80px !important}
  .deitado .ps .list{gap:14px;margin-top:20px}
  .deitado .ps .li{font-size:30px;gap:18px}
  .deitado .ps .li i{width:42px;height:42px;font-size:16px}
  .deitado .ps .tl{margin:50px 40px 0}
  .deitado .ps .tl .lab{font-size:15px}
  .deitado .ps .tl .lab b{font-size:24px}
  .deitado .ps .sum .term{font-size:80px}
  .deitado .ps .sum .op{font-size:60px}
  .deitado .ps .sum .res{font-size:140px}
  .deitado .ps .sum .res small{font-size:60px}
  .deitado .ps .pill{font-size:30px;padding:18px 32px}
  .deitado .ps.faixa{top:330px}
  .deitado .ps .fx{padding:26px 34px 30px 52px}
  .deitado .ps .fx .k{font-size:20px}
  .deitado .ps .fx .h{font-size:46px}
  .deitado #bhalo{width:620px;height:620px;margin:-310px 0 0 -310px}
  .deitado #bname .n{font-size:84px}
  .deitado #bname .fios{width:640px}
  .deitado .outro .in{left:140px;right:140px}
  .deitado .outro .ologo{width:300px;margin-bottom:30px}
  .deitado .outro .h{font-size:132px}
  .deitado .outro .pill{margin-top:36px;font-size:36px;padding:24px 40px}
  .deitado .outro .brand{margin-top:34px;font-size:20px}
  .deitado .outro .disc{left:140px;right:140px;bottom:46px;font-size:18px}
  .deitado .insert img{width:360px}

  /* ===== visual dinamico (estilo.visual = "dinamico", aprovado em 02/10/2026) ===== */
  #cutwin{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
  #cut{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;will-change:transform,filter}
  #atras{position:absolute;left:0;right:0;top:150px;height:420px;z-index:1;text-align:center;pointer-events:none}
  #atras div{position:absolute;left:0;right:0;top:0}
  /* variação "letra": cada letra vira um span, e o dourado (background-clip:text) do bloco não pinta dentro de
     inline-block — as letras ficavam transparentes e o texto por trás nunca aparecia (03/10/2026) */
  #atras div span{background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:.24em;margin-top:-.24em}  /* a caixa da letra cobre o acento (o É saía sem o acento) */
  #atras div{font-family:"Bebas Neue",Impact,sans-serif;font-size:350px;line-height:.82;letter-spacing:.01em;padding-top:.12em;
    background:linear-gradient(180deg,#FFF6DE 0%,#F4D692 50%,#E2B862 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
  .cap.pop{font-family:Manrope,sans-serif;font-weight:800;font-size:94px;text-transform:uppercase;letter-spacing:-.02em;line-height:1.08;
    text-shadow:0 0 2px #000,0 3px 0 rgba(0,0,0,.85),0 6px 0 rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.7)}
  .cap.pop .capin{background:none;padding:0 20px}
  .cap.pop span{position:relative;margin:0 15px 10px}
  .cap.pop span.todo{color:#fff;opacity:.0}
  .cap.pop span.done{color:#fff}
  /* palavra dita cresce 6% (com 10% a palavra longa engolia o espaço da vizinha: "FOICONSIDERADO", 05/10/2026) */
  .cap.pop span.cur{color:#fff;transform:scale(1.06) translateY(-4px)}
  .cap.pop span.k{color:var(--navy);text-shadow:none;z-index:1}
  .cap.pop span.k::before{content:"";position:absolute;left:-14px;right:-14px;top:4px;bottom:-2px;z-index:-1;border-radius:12px;transform:rotate(-2.5deg) scaleX(var(--hk,1));transform-origin:0 50%;
    background:linear-gradient(180deg,#FFF3D6 0%,#F4D692 55%,#EBC776 100%);box-shadow:0 8px 22px rgba(0,0,0,.45)}
  /* variacoes do dinamico (sorteadas por video): marca-texto da legenda e cor dos adesivos */

<script>
